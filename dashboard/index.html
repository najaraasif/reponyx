<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reponyx Operations</title><style>body{font:15px system-ui;margin:0;background:#0b1020;color:#eef2ff}main{max-width:1100px;margin:40px auto;padding:0 24px}h1{font-size:34px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#151d35;border:1px solid #293657;border-radius:12px;padding:20px}.value{font-size:28px;font-weight:700;margin-top:8px}button{background:#6ee7b7;border:0;padding:10px 14px;border-radius:8px;font-weight:700}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}</style></head>
<body><main><h1>Reponyx</h1><p>AI Software Engineering Agent</p><p>Repair, verification, and evaluation overview.</p><section class="grid"><div class="card">Total repairs<div class="value" id="total">-</div></div><div class="card">Successful<div class="value" id="success">-</div></div><div class="card">Pending review<div class="value" id="review">-</div></div><div class="card">Provider<div class="value" id="provider">-</div></div></section><div class="card" style="margin-top:20px"><button id="refresh">Refresh</button><pre id="output">Loading...</pre></div></main><script>async function load(){try{const r=await fetch('/repairs');const items=await r.json();document.querySelector('#total').textContent=items.length;document.querySelector('#success').textContent=items.filter(x=>x.status==='completed').length;document.querySelector('#review').textContent=items.filter(x=>x.status==='completed').length;document.querySelector('#provider').textContent='configured';document.querySelector('#output').textContent=JSON.stringify(items,null,2)}catch(e){document.querySelector('#output').textContent='API unavailable'}}document.querySelector('#refresh').onclick=load;load()</script></body></html>
